version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusconnect-server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env.production
    volumes:
      # Persist log files outside the container
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Notes:
#  - MongoDB is hosted on Atlas — no local mongo container needed.
#  - Populate .env.production with real secrets before running:
#      docker compose up -d
